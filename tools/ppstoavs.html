<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPStoAVS Host</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b2130; --muted: #6b7385; --line: #e2e5ea; --soft: #f1f3f6;
  --accent: #2563eb; --accent-soft: #e8f0fe; --accent-text: #ffffff;
  --ok: #15803d; --ok-soft: #e7f6ec; --warn: #b45309; --warn-soft: #fdf3e2; --bad: #c02626; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --text: #e5e8ec; --muted: #939cab; --line: #2a3039; --soft: #1e232b;
    --accent: #5b93ff; --accent-soft: #1b2740; --accent-text: #0b0e12;
    --ok: #4ade80; --ok-soft: #13291c; --warn: #fbbf24; --warn-soft: #2d2412; --bad: #f87171; --bad-soft: #321a1a;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
button, input, select { font: inherit; color: inherit; }

/* ---------- header & tabs ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.conn { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.spacer { flex: 1; }
.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 14px 10px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.view { display: grid; gap: 16px; }
.view[hidden] { display: none; }

/* ---------- basics ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.tag { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; line-height: 18px; font-weight: 600;
  background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag:empty { display: none; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
select, input[type=number] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
input[type=number] { width: 100px; }

/* ---------- notice ---------- */
.notice { border: 1px dashed var(--line); border-radius: 12px; padding: 18px 20px; background: var(--panel); }
.notice h3 { margin: 0 0 8px; font-size: 15px; }
.notice ol { margin: 0; padding-left: 20px; }
.notice.bad { border-color: var(--bad); color: var(--bad); }

/* ---------- status flow ---------- */
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 10px; }
.node { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.node .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.node .big { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 6px; font-variant-numeric: tabular-nums; }
.node .sub { color: var(--muted); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.node.mid { background: var(--soft); }
.arrow { align-self: center; color: var(--muted); font-size: 20px; }
@media (max-width: 760px) {
  .flow { grid-template-columns: 1fr; }
  .arrow { transform: rotate(90deg); justify-self: center; line-height: 1; }
}

/* ---------- tables ---------- */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--accent-soft); }
tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.nw { white-space: nowrap; }
.empty { color: var(--muted); padding: 10px 0; }

/* ---------- settings ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 3px; }
.opt b { display: block; font-weight: 600; }
.opt span { display: block; color: var(--muted); font-size: 12px; }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 12px 16px; align-items: center; }
.fields > .lbl { color: var(--muted); }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; justify-self: start; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-text); }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip:has(input:checked) { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.chip input { display: none; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; }
.check b { font-weight: 600; }
.check span { display: block; color: var(--muted); font-size: 12px; }
.labgrp { margin: 16px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.labs { display: grid; gap: 8px; }
.lab { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.lab:has(.labhead input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.lab.off { opacity: .55; }
.labhead { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.labhead input { margin-top: 3px; }
.labhead b { font-weight: 600; }
.labhead span:not(.tag):not(.labtags) { display: block; color: var(--muted); font-size: 12px; }
.labtags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.lab details { margin: 6px 0 0 24px; font-size: 12px; color: var(--muted); }
.lab summary { cursor: pointer; color: var(--accent); width: max-content; }
.lab ul { margin: 6px 0 2px; padding-left: 18px; }
.lab li { margin: 3px 0; }
.labin { margin: 8px 0 0 24px; }
.labin input[type=number] { width: 84px; }
@media (max-width: 640px) { .labhead { flex-wrap: wrap; } .labtags { margin-left: 24px; justify-content: flex-start; } }
.actions { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
@media (max-width: 640px) { .fields { grid-template-columns: 1fr; gap: 4px 0; } .fields > .lbl { margin-top: 8px; } }

/* ---------- log ---------- */
.logbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters { display: inline-flex; gap: 4px; }
.filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.ev { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.ev.ok::before { background: var(--ok); }
.ev.warn::before { background: var(--warn); }
.ev.bad::before { background: var(--bad); }
.ev.acc::before { background: var(--accent); }
.logrow { display: grid; grid-template-columns: 84px 128px 1fr; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }
.logrow.head { color: var(--muted); font-size: 12px; padding-top: 0; }
.logrow .time { color: var(--muted); padding-top: 1px; }
@media (max-width: 640px) {
  .logrow { grid-template-columns: auto 1fr; }
  .logrow .detail { grid-column: 1 / -1; }
  .logrow.head { display: none; }
}
.pdos { display: flex; flex-wrap: wrap; gap: 4px; }
.pdo { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 12px; white-space: nowrap; background: var(--soft); }
.pdo i { font-style: normal; color: var(--muted); }
#msg { font-size: 12px; color: var(--bad); }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand">PPStoAVS</div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText"></span><span id="devInfo"></span></div>
    <span class="spacer"></span>
    <span id="msg"></span>
    <select id="lang" aria-label="Language"><option value="zh">繁體中文</option><option value="en">English</option></select>
    <button class="btn primary" id="btnConnect"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="status" data-i18n="tabStatus"></button>
    <button class="tab" role="tab" data-tab="settings" data-i18n="tabSettings"></button>
    <button class="tab" role="tab" data-tab="log" data-i18n="tabLog"></button>
  </nav>
</div>

<main>
  <!-- ===== 狀態 ===== -->
  <div class="view" id="view-status">
    <div class="notice" id="guide">
      <h3 data-i18n="guideTitle"></h3>
      <ol><li data-i18n="guide1"></li><li data-i18n="guide2"></li><li data-i18n="guide3"></li></ol>
    </div>
    <div class="flow">
      <div class="node">
        <div class="label"><span data-i18n="charger"></span><span class="tag" id="feTag"></span></div>
        <div class="big" id="feBig">—</div>
        <div class="sub" id="feSub"></div>
      </div>
      <div class="arrow">→</div>
      <div class="node mid">
        <div class="label"><span data-i18n="converter"></span><span class="tag" id="swTag"></span></div>
        <div class="big" id="vbusBig">—</div>
        <div class="sub" id="vbusSub"></div>
      </div>
      <div class="arrow">→</div>
      <div class="node">
        <div class="label"><span data-i18n="device"></span><span class="tag" id="beTag"></span></div>
        <div class="big" id="beBig">—</div>
        <div class="sub" id="beSub"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="card"><h3 data-i18n="chargerCaps"></h3><div class="scroll" id="frontCaps"></div></div>
      <div class="card"><h3><span data-i18n="rearCaps"></span><span class="tag" id="avs2Tag"></span></h3><div class="scroll" id="rearCaps"></div></div>
    </div>
  </div>

  <!-- ===== 設定 ===== -->
  <div class="view" id="view-settings" hidden>
    <div class="card">
      <h3 data-i18n="secMode"></h3>
      <div class="modes">
        <label class="opt"><input type="radio" name="mode" value="0"><div><b data-i18n="modeA"></b><span data-i18n="modeAd"></span></div></label>
        <label class="opt"><input type="radio" name="mode" value="1"><div><b data-i18n="modeB"></b><span data-i18n="modeBd"></span></div></label>
        <label class="opt"><input type="radio" name="mode" value="2"><div><b data-i18n="modeC"></b><span data-i18n="modeCd"></span></div></label>
        <label class="opt"><input type="radio" name="mode" value="3"><div><b data-i18n="modeD"></b><span data-i18n="modeDd"></span></div></label>
      </div>
      <div style="margin-top:14px">
        <label class="check"><input type="checkbox" id="fix12"><div><b data-i18n="fix12"></b><span data-i18n="fix12d"></span></div></label>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3 data-i18n="secLimits"></h3>
        <div class="fields">
          <div class="lbl" data-i18n="maxV"></div>
          <div class="seg">
            <label><input type="radio" name="maxMv" value="15000">15 V</label>
            <label><input type="radio" name="maxMv" value="20000">20 V</label>
          </div>
          <div class="lbl" data-i18n="maxI"></div>
          <div class="inline"><input type="number" id="maxMa" min="500" max="3000" step="50"><span class="muted">mA</span><span class="small muted" id="maxIdTxt" data-i18n="maxId"></span></div>
          <div class="lbl" data-i18n="hide"></div>
          <div>
            <div class="inline">
              <label class="chip"><input type="checkbox" data-bit="0">9 V</label>
              <label class="chip"><input type="checkbox" data-bit="1">12 V</label>
              <label class="chip"><input type="checkbox" data-bit="2">15 V</label>
              <label class="chip"><input type="checkbox" data-bit="3">20 V</label>
            </div>
            <div class="small muted" style="margin-top:6px" data-i18n="hideD"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="secProt"></h3>
        <div class="fields">
          <div class="lbl" data-i18n="ovp"></div>
          <div class="inline"><input type="number" id="ovp" min="1" max="20"><span class="muted">%</span></div>
          <div class="lbl" data-i18n="uvp"></div>
          <div class="inline"><input type="number" id="uvp" min="1" max="20"><span class="muted">%</span><span class="small muted" data-i18n="uvpD"></span></div>
          <div class="lbl" data-i18n="ocp"></div>
          <div class="inline"><input type="number" id="ocpMa" min="500" max="5000" step="50"><span class="muted">mA</span>
            <input type="number" id="ocpMs" min="1" max="1000"><span class="muted">ms</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="secLog"></h3>
      <label class="check"><input type="checkbox" id="logPps"><div><b data-i18n="logPps"></b><span data-i18n="logPpsD"></span></div></label>
    </div>

    <div class="card">
      <h3><span data-i18n="secLab"></span><span class="tag warn">Lab</span></h3>
      <div class="small muted" data-i18n="labD"></div>
      <h4 class="labgrp" data-i18n="labFront"></h4>
      <div class="labs">
        <div class="lab" id="lab-fe2nd">
          <label class="labhead"><input type="checkbox" id="fe2nd"><div><b data-i18n="fe2nd"></b><span data-i18n="fe2ndS"></span></div><span class="labtags"></span></label>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="fe2ndL"></ul></details>
        </div>
        <div class="lab" id="lab-emarker">
          <label class="labhead"><input type="checkbox" id="emarker"><div><b data-i18n="emarker"></b><span data-i18n="emarkerS"></span></div><span class="labtags"><span class="tag warn" data-i18n="tagHw"></span><span class="tag acc" data-i18n="tag5a"></span></span></label>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="emarkerL"></ul></details>
        </div>
      </div>
      <h4 class="labgrp" data-i18n="labRear"></h4>
      <div class="labs">
        <div class="lab" id="lab-be2nd">
          <label class="labhead"><input type="checkbox" id="be2nd"><div><b data-i18n="be2nd"></b><span data-i18n="be2ndS"></span></div><span class="labtags"><span class="tag " data-i18n="tagAC"></span></span></label>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="be2ndL"></ul></details>
        </div>
        <div class="lab" id="lab-avs2pps">
          <label class="labhead"><input type="checkbox" id="avs2pps"><div><b data-i18n="avs2pps"></b><span data-i18n="avs2ppsS"></span></div><span class="labtags"><span class="tag " data-i18n="tagBC"></span></span></label>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="avs2ppsL"></ul></details>
        </div>
        <div class="lab" id="lab-eprAvs">
          <label class="labhead"><input type="checkbox" id="eprAvs"><div><b data-i18n="eprAvs"></b><span data-i18n="eprAvsS"></span></div><span class="labtags"><span class="tag acc" data-i18n="tagNeedEm"></span><span class="tag " data-i18n="tagAC"></span></span></label>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="eprAvsL"></ul></details>
        </div>
        <div class="lab" id="lab-fixc">
          <label class="labhead"><input type="checkbox" id="fixc"><div><b data-i18n="fixc"></b><span data-i18n="fixcS"></span></div><span class="labtags"><span class="tag " data-i18n="tagNo12"></span></span></label>
          <div class="labin inline" id="fixcIn"><input type="number" id="fixcV" min="5.1" max="20" step="0.1"><span class="muted">V</span>
            <input type="number" id="fixcA" min="0.5" max="5" step="0.05"><span class="muted">A</span><span class="small muted" data-i18n="fixcRange"></span></div>
          <details><summary data-i18n="labMore"></summary><ul data-i18n-list="fixcL"></ul></details>
        </div>
      </div>
    </div>

    <div class="card">
      <h3><span data-i18n="rearCaps"></span><span class="tag" data-i18n="nowTag"></span><span class="tag" id="avs2Tag2"></span></h3>
      <div class="scroll" id="rearCaps2"></div>
    </div>

    <div class="actions">
      <span class="tag" id="cfgState"></span>
      <span class="small muted" id="dirtyText"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnDefaults" data-i18n="defaults"></button>
      <button class="btn" id="btnRevert" data-i18n="revert"></button>
      <button class="btn primary" id="btnApply" data-i18n="apply"></button>
    </div>
  </div>

  <!-- ===== 記錄 ===== -->
  <div class="view" id="view-log" hidden>
    <div class="card">
      <div class="logbar">
        <select id="sessionSel" aria-label="Session"></select>
        <div class="filters" id="filters">
          <button data-f="all" data-i18n="fAll"></button>
          <button data-f="req" data-i18n="fReq"></button>
          <button data-f="caps" data-i18n="fCaps"></button>
          <button data-f="bad" data-i18n="fBad"></button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="btnLogRefresh" data-i18n="refresh"></button>
        <button class="btn" id="btnExport" data-i18n="export"></button>
        <button class="btn danger" id="btnClear" data-i18n="clear"></button>
      </div>
      <div class="stats" id="logStats" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div id="logTable"></div>
      <div class="small muted" id="logNote" style="margin-top:8px"></div>
    </div>
  </div>
</main>

<script>
"use strict";
/* ================= i18n ================= */
const T = {
  en: {
    connect: "Connect", disconnect: "Disconnect", connected: "Connected", notConnected: "Not connected",
    noHid: "WebHID is not available in this browser. Use desktop Chrome or Edge.",
    tabStatus: "Status", tabSettings: "Settings", tabLog: "Records",
    guideTitle: "How to connect", guide1: "Plug the front Type-C plug into a computer (no charger needed).",
    guide2: "Click Connect at the top right.", guide3: "Select \"PPStoAVS Bridge\" and allow access.",
    charger: "Charger (front)", converter: "Converter", device: "Device (rear)",
    chargerCaps: "Charger capabilities", rearCaps: "Offered to device",
    stWait: "Waiting", stNeg: "Negotiating", stReady: "Contract", stLegacy: "Non-PD", stNone: "Not attached",
    stDetect: "Detecting", stUpdate: "Updating caps", stReset: "Resetting", stNoPd: "Non-PD device (5 V)", stDischarge: "Discharging",
    swOn: "Switch on", swOff: "Switch off", current: "Current", noContract: "No contract",
    colType: "Type", colVolt: "Voltage", colCur: "Current", colSrc: "From charger", converted: "converted",
    none: "—", notAvail: "Not connected",
    secMode: "Output mode", modeA: "a · Fixed + AVS", modeAd: "Default. Passes the charger's AVS through, or translates it from PPS.",
    modeB: "b · Fixed + PPS", modeBd: "Charger PPS passed through as-is. No AVS.",

/* ================= settings ================= */
function cfgFromBytes(p) {

  return { mode: radio("mode"), hide, maxMv: radio("maxMv"), maxMa: Math.round(Number($("maxMa").value) / 50) * 50,
    ovp: Number($("ovp").value), uvp: Number($("uvp").value), ocpMa: Number($("ocpMa").value), ocpMs: Number($("ocpMs").value),
    flags: ($("fix12").checked ? 1 : 0) | ($("logPps").checked ? 2 : 0) | ($("fe2nd").checked ? 4 : 0) | ($("be2nd").checked ? 8 : 0) | ($("avs2pps").checked ? 16 : 0) | ($("emarker").checked ? 32 : 0) | ($("eprAvs").checked ? 64 : 0) | ($("fixc").checked ? 128 : 0),
    fixDv: Math.round(Number($("fixcV").value) * 10) || 0, fixMa50: Math.round(Number($("fixcA").value) * 20) || 0 };

  document.querySelectorAll("input[name=maxMv]").forEach((r) => (r.checked = Number(r.value) === c.maxMv));

  $("fe2nd").checked = !!(c.flags & 4); $("be2nd").checked = !!(c.flags & 8); $("avs2pps").checked = !!(c.flags & 16); $("emarker").checked = !!(c.flags & 32); $("eprAvs").checked = !!(c.flags & 64);
  $("fixc").checked = !!(c.flags & 128); $("fixcV").value = c.fixDv ? (c.fixDv / 10).toFixed(1) : "7.4"; $("fixcA").value = c.fixMa50 ? (c.fixMa50 / 20).toFixed(2) : "2.00";

}
const isDirty = () => !!state.cfg && JSON.stringify(readForm()) !== JSON.stringify(state.cfg);
function updateDirty() {

  $("dirtyText").style.color = d ? "var(--warn)" : "";
  $("btnApply").disabled = !dev || !d; $("btnRevert").disabled = !dev || !d;
}

/* ================= records ================= */
async function loadSessions() {

    const s = state.sessions.find((x) => x.session === id);

async function readPage(idx) {

  if (s) for (let k = 0; k < s.pages; k++) pages.push({ idx: (s.first + k) % 128, ram: false });
  if (session === state.current) {

      case 10: {
        text = `${t("side")[d[0]] ?? d[0]} · ${t("rst")[d[1]] ?? d[1]}`;
        if (d.length >= 5) text += ` · ${t("stateAt")} ${(d[0] ? t("beSt") : t("feSt"))[d[2]] ?? d[2]} · ${t("rxErr")} ${u16(d, 3)}`;
        cls = "warn"; cat = "bad"; break; }
      case 14: {
        const code = d[1], x = d.length >= 3 ? d[2] : 0;
        text = code === 4 ? `${t("note4")}${t("eprFail")[x] ?? x}` : t("note" + code) !== "note" + code ? t("note" + code) : `${t("side")[d[0]] ?? d[0]} · ${code}`;
        const info = code === 2 || code === 3 || code === 5;
        cls = info ? "acc" : "warn"; cat = info ? "" : "bad"; break; }
      case 11: text = cfgText(cfgFromBytes(d)); cls = "acc"; break;
      case 13: {
        const modes = "0x" + d[2].toString(16).toUpperCase().padStart(2, "0");
        if (d[1] === 0) text = `${t("avs2Fe")} (Sink Modes ${modes})`;
        else if (d[1] === 1) text = `${t("avs2Be")} ${modes} · ${d[2] & 0x20 ? t("avs2Yes") : t("avs2No")}`;
        else text = t("avs2None");
        cls = d[1] === 1 && d[2] & 0x20 ? "ok" : d[1] === 0 ? "acc" : "warn"; cat = "caps";
        break; }
      default: text = Array.from(d, (x) => x.toString(16).padStart(2, "0")).join(" ");
    }
    return { t: r.t, type: r.type, name: t("ev")[r.type] ?? "type " + r.type, text, html: html ?? esc(text), cls, cat };
  });
}
function renderLog() {
  const L = state.log;
  document.querySelectorAll("#filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === state.filter)));
  if (!L || !dev) { $("logTable").innerHTML = ""; $("logNote").textContent = ""; $("logStats").innerHTML = ""; return; }
  const rows = decodeRecords(L.records);
  const count = (f) => rows.filter(f).length;
  const nReq = count((r) => r.type === 8), nFail = count((r) => r.type === 8 && r.cls === "bad");
  const nProt = count((r) => r.type === 9), nRst = count((r) => r.type === 10);
  $("logStats").innerHTML = [
    `<span class="tag">${nReq} ${t("stReq")}</span>`,
    `<span class="tag ${nFail ? "bad" : ""}">${nFail} ${t("stFail")}</span>`,
    `<span class="tag ${nProt ? "bad" : ""}">${nProt} ${t("stProt")}</span>`,
    `<span class="tag ${nRst ? "warn" : ""}">${nRst} ${t("stRst")}</span>`,
  ].join("");
  const shown = rows.filter((r) => state.filter === "all" || r.cat === state.filter);
  $("logTable").innerHTML = shown.length
    ? `<div class="logrow head"><div>${t("colTime")}</div><div>${t("colEvent")}</div><div>${t("colDetail")}</div></div>` +
      shown.map((r) => `<div class="logrow"><div class="time mono">${(r.t / 1000).toFixed(3)} s</div>` +
        `<div><span class="ev ${r.cls}">${esc(r.name)}</span></div><div class="detail">${r.html}</div></div>`).join("")
    : `<div class="empty">${t("noRecords")}</div>`;
  const notes = [];
  if (L.crcErrors) notes.push(`${L.crcErrors} ${t("crcBad")}`);
  if (L.session === state.current && state.info && state.info.dropped) notes.push(`${state.info.dropped} ${t("dropped")}`);
  $("logNote").textContent = notes.join(" · ");
}
function exportLog() {
  if (!state.log) return;
  const out = { session: state.log.session, exported: new Date().toISOString(),
    records: decodeRecords(state.log.records).map((r, i) => ({ t_ms: r.t, event: r.name, detail: r.text,
      raw: Array.from(state.log.records[i].data, (x) => x.toString(16).padStart(2, "0")).join("") })) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = `ppstoavs-session-${state.log.session}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= render all / i18n ================= */
function applyI18n() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-list]").forEach((el) => {
    el.replaceChildren(...(t(el.dataset.i18nList) || []).map((x) => Object.assign(document.createElement("li"), { textContent: x })));
  });
  $("lang").value = lang;
  renderAll();
}
function renderAll() { renderConn(); renderStatus(); renderCfgState(); updateDirty(); if (state.log) loadSessionsLabelsOnly(); renderLog(); }
function loadSessionsLabelsOnly() {
  const sel = $("sessionSel");
  Array.from(sel.options).forEach((o) => {
    const id = Number(o.value), s = state.sessions.find((x) => x.session === id);
    o.textContent = `${t("sessionN")(id)}${id === state.current ? ` (${t("currentS")})` : ""} · ${s ? s.pages : 0} ${t("pages")}`;
  });
}

/* ================= wiring ================= */
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
$("btnConnect").onclick = connect;
$("view-settings").addEventListener("input", updateDirty);
$("view-settings").addEventListener("change", updateDirty);
$("logPps").addEventListener("change", (e) => { if (e.target.checked && !confirm(t("logPpsWarn"))) { e.target.checked = false; updateDirty(); } });
/* 5A E-Marker：電流上限 5A、OCP 5.5A；關閉時收回到 3A / 5A */
function applyCurLimits() {
  const a5 = $("emarker").checked, mi = $("maxMa"), oi = $("ocpMa");
  mi.max = a5 ? 5000 : 3000; oi.max = a5 ? 5500 : 5000;
  if (Number(mi.value) > Number(mi.max)) mi.value = mi.max;
  if (Number(oi.value) > Number(oi.max)) oi.value = oi.max;
  $("maxIdTxt").dataset.i18n = a5 ? "maxId5" : "maxId"; $("maxIdTxt").textContent = t($("maxIdTxt").dataset.i18n);
  applyLabDeps();
}
/* Lab 相依：EPR AVS 需要 E-Marker；自訂 Fixed 才顯示輸入框 */
function applyLabDeps() {
  const a5 = $("emarker").checked;
  $("eprAvs").disabled = !a5; if (!a5) $("eprAvs").checked = false;
  $("lab-eprAvs").classList.toggle("off", !a5);
  $("fixcIn").hidden = !$("fixc").checked;
}
/* 自訂 Fixed 與 12V 轉換互斥 */
$("fixc").addEventListener("change", (e) => { if (e.target.checked && $("fix12").checked) { $("fix12").checked = false; msg(t("fixcOff12")); } applyLabDeps(); updateDirty(); });
$("fix12").addEventListener("change", (e) => { if (e.target.checked && $("fixc").checked) { $("fixc").checked = false; msg(t("fix12OffC")); } applyLabDeps(); updateDirty(); });
$("emarker").addEventListener("change", (e) => { if (e.target.checked && !confirm(t("emarkerWarn"))) e.target.checked = false; applyCurLimits(); updateDirty(); });
$("btnApply").onclick = () => applyCfg(false);
$("btnRevert").onclick = () => state.cfg && writeForm(state.cfg);
$("btnDefaults").onclick = () => { if (confirm(t("defaultsConfirm"))) applyCfg(true); };
$("btnLogRefresh").onclick = () => loadSessions().catch((e) => msg(e.message));
$("sessionSel").onchange = (e) => loadLog(Number(e.target.value)).catch((err) => msg(err.message));
document.querySelectorAll("#filters button").forEach((b) => (b.onclick = () => { state.filter = b.dataset.f; renderLog(); }));
$("btnExport").onclick = exportLog;
$("btnClear").onclick = async () => {
  if (!confirm(t("clearConfirm"))) return;
  try { await request(0x22); setTimeout(() => loadSessions().catch(() => {}), 1500); } catch (e) { msg(e.message); }
};
$("lang").onchange = (e) => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (err) {} applyI18n(); };

let tick = 0;
setInterval(async () => {
  if (!dev) return;
  try {
    await refreshStatus();
    if (++tick % 3 === 0) { await refreshInfo(); if (state.cfgSaving || $("cfgState").textContent === t("saving")) await loadCfg(false); }
  } catch (e) { msg(e.message); }
}, 1000);

let startTab = "status";
try { startTab = localStorage.getItem("tab") || startTab; } catch (e) {}
setTab(["status", "settings", "log"].includes(startTab) ? startTab : "status");
applyI18n();

if (!("hid" in navigator)) {
  const g = $("guide"); g.className = "notice bad"; g.innerHTML = `<h3>${esc(t("noHid"))}</h3>`;
  $("btnConnect").disabled = true;
} else {
  navigator.hid.addEventListener("disconnect", (e) => { if (e.device === dev) { dev = null; resetState(); renderAll(); } });
  navigator.hid.getDevices().then((list) => {
    const d = list.find((x) => x.vendorId === FILTER.vendorId && x.productId === FILTER.productId);
    if (d) openDevice(d).catch((e) => msg(e.message));
  });
}
</script>
