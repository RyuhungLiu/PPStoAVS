<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPStoAVS Host</title>
<style>
/* PPStoAVS Host
   識別：PCB。阻焊綠的「電路板」承載即時讀數與電壓軸，其餘頁面保持平面、安靜。
   電壓色階（冷 → 暖）是資訊：5 V 藍、9 V 青綠、12 V 黃、15 V 橘、20 V 紅。
   單一 HTML，離線，不引外部字型。 */
:root {
  --mask: #0f3d31; --mask-deep: #092b23; --silk: #eef2e8; --gold: #d6ad4a;
  --bg: #e6ebe2; --panel: #f6f8f2; --text: #17231e; --muted: #5a6a62; --line: #cbd4c9; --soft: #edf1e9; --line-strong: #98a79c;
  --accent: #17624c; --accent-soft: #dcebe1; --accent-text: #ffffff; --on: #1d6b52; --on-ink: #ffffff;
  --ok: #157a44; --ok-soft: #dcf1e3; --warn: #93590a; --warn-soft: #f8ebcf; --bad: #b0281f; --bad-soft: #f8e1de;
  --v5: #2b7fc9; --v9: #14957f; --v12: #b8900a; --v15: #cf6a12; --v20: #c93c32;
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans CJK TC", sans-serif;
  --num: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #071e18; --panel: #0d2b23; --text: #e4eadf; --muted: #93a79c; --line: #1e4136; --soft: #123227; --line-strong: #40655a;
    --accent: #e0bb5a; --accent-soft: #2a3a25; --accent-text: #241c05; --on: #d6ad4a; --on-ink: #241c05;
    --ok: #6fdc9b; --ok-soft: #12382a; --warn: #f0be55; --warn-soft: #3a2f12; --bad: #ff8c82; --bad-soft: #401c19;
    --v5: #6fb4f0; --v9: #4fd1b8; --v12: #e8c547; --v15: #f0964a; --v20: #ee6a5f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: var(--gold); color: #241c05; }

/* ---------- 頁首：阻焊綠底板，絲印白字，鍍金焊盤 ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--mask); color: var(--silk); box-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 18px/1 var(--num); letter-spacing: .02em; }
.brand::before { content: ""; width: 7px; height: 16px; border-radius: 2px; background: var(--gold); box-shadow: 11px 0 0 var(--gold); margin-right: 11px; }
.conn { display: flex; align-items: center; gap: 8px; color: rgba(238, 242, 232, .7); font-size: 13px; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px rgba(238, 242, 232, .4); flex: none; }
.dot.on { background: #7be0a3; box-shadow: 0 0 0 3px rgba(123, 224, 163, .25); }
.spacer { flex: 1; }
.top select { background: rgba(238, 242, 232, .08); border-color: rgba(238, 242, 232, .25); color: var(--silk); }
.top select option { color: #17231e; }
.top .btn { background: transparent; border-color: rgba(238, 242, 232, .3); color: var(--silk); }
.top .btn.primary { background: var(--gold); border-color: var(--gold); color: #241c05; font-weight: 600; }
.top .btn.primary:hover:not(:disabled) { background: #e4bf5f; border-color: #e4bf5f; }
#msg { font-size: 12px; color: #ffb4ac; }
.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px 10px; cursor: pointer; color: rgba(238, 242, 232, .62); white-space: nowrap;
  border-bottom: 3px solid transparent; font-weight: 500; font-size: 14px; }
.tab:hover { color: var(--silk); }
.tab[aria-selected="true"] { color: var(--silk); border-bottom-color: var(--gold); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 32px; }
.view { display: grid; gap: 20px; }
.view[hidden] { display: none; }

/* ---------- 基礎 ---------- */
.card { min-width: 0; padding: 18px 0 0; border-top: 1px solid var(--line-strong); }
.card h3 { font: 600 15px/1.4 var(--sans); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px 32px; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn.primary { background: var(--on); border-color: var(--on); color: var(--on-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: var(--on); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); }
.btn:disabled { opacity: .4; cursor: default; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
.tag { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 19px; font-weight: 500; background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag:empty { display: none; }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
select, input[type=number] { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); font-variant-numeric: tabular-nums; }
input[type=number] { width: 100px; }
input:focus-visible, select:focus-visible { outline-offset: 0; }

/* 開關與單選 */
input[type=checkbox], input[type=radio] { -webkit-appearance: none; appearance: none; margin: 0; flex: none; cursor: pointer; vertical-align: middle; }
input[type=checkbox] { width: 32px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; transition: background .15s; }
input[type=checkbox]::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
input[type=checkbox]:checked { background: var(--on); }
input[type=checkbox]:checked::after { transform: translateX(14px); background: var(--on-ink); }
input[type=radio] { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: inline-grid; place-content: center; background: var(--panel); }
input[type=radio]:checked { border-color: var(--on); }
input[type=radio]:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on); }
input:disabled { cursor: default; }
@media (prefers-reduced-motion: reduce) { input[type=checkbox], input[type=checkbox]::after { transition: none; } }

.notice { border: 1px solid var(--line-strong); border-left: 4px solid var(--gold); border-radius: 6px; padding: 14px 18px; background: var(--panel); }
.notice h3 { margin: 0 0 6px; font-size: 15px; }
.notice ol { margin: 0; padding-left: 20px; }
.notice.bad { border-left-color: var(--bad); color: var(--bad); }

/* ---------- 狀態：電路板 ---------- */
.board { --silk-dim: rgba(238, 242, 232, .62); position: relative; background: var(--mask); color: var(--silk); border-radius: 10px; overflow: hidden;
  --v5: #6fb4f0; --v9: #4fd1b8; --v12: #e8c547; --v15: #f0964a; --v20: #ee6a5f; }
.board .tag { background: rgba(238, 242, 232, .12); color: var(--silk); border-color: transparent; }
.board .tag.ok { color: #8be6ad; }
.board .tag.warn { color: #f2c25c; }
.board .tag.bad { color: #ff9a90; }
.board .tag.acc { color: #9fd6ff; }
.flow { display: grid; grid-template-columns: 1fr auto 1.15fr auto 1fr; align-items: center; padding: 22px 24px 18px; }
.node { min-width: 0; }
.node .label { font-size: 13px; color: var(--silk-dim); display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.node .big { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; line-height: 1.05; font-family: var(--num); font-variant-numeric: tabular-nums; }
.node .big .n { font-size: 44px; font-weight: 500; letter-spacing: -.01em; }
.node .big .u { font-size: 18px; color: var(--silk-dim); }
.node.mid .big .n { font-size: 60px; font-weight: 600; }
.node.mid .big .u { font-size: 22px; }
.node .sub { color: var(--silk-dim); font-size: 13px; margin-top: 8px; min-height: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rail { position: relative; width: 56px; height: 3px; margin: 0 14px; background: rgba(238, 242, 232, .2); border-radius: 2px; }
.rail::before, .rail::after { content: ""; position: absolute; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
.rail::before { left: -5px; }
.rail::after { right: -5px; }
.rail[data-on="1"] { background: repeating-linear-gradient(90deg, var(--gold) 0 8px, rgba(214, 173, 74, .25) 8px 14px); background-size: 14px 3px; animation: rail-x .8s linear infinite; }
@keyframes rail-x { to { background-position: 14px 0; } }
@keyframes rail-y { to { background-position: 0 14px; } }
@media (prefers-reduced-motion: reduce) { .rail[data-on="1"] { animation: none; } }
@media (max-width: 760px) {
  .flow { grid-template-columns: 1fr; padding: 18px 18px 8px; }
  .rail { width: 3px; height: 34px; margin: 10px 0 10px 4px; }
  .rail::before, .rail::after { left: -3px; right: auto; }
  .rail::before { top: -5px; } .rail::after { top: auto; bottom: -5px; }
  .rail[data-on="1"] { background: repeating-linear-gradient(180deg, var(--gold) 0 8px, rgba(214, 173, 74, .25) 8px 14px); background-size: 3px 14px; animation-name: rail-y; }
  .node.mid .big .n { font-size: 52px; }
}

/* 電壓軸：充電器提供什麼、設備得到什麼、此刻 VBUS 在哪 */
.vaxis { position: relative; margin: 0 24px; padding: 34px 0 20px; border-top: 1px solid rgba(238, 242, 232, .16); }
.vrow { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; column-gap: 12px; }
.vrow > span { font-size: 12px; color: var(--silk-dim); line-height: 1.25; }
.track { position: relative; height: 26px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: rgba(238, 242, 232, .14); }
.track .pin { position: absolute; top: 3px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--vc); opacity: .85; }
.track .span { position: absolute; top: 8px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--vc), var(--vc2)); opacity: .5; }
.track .on { opacity: 1; box-shadow: 0 0 0 2px var(--mask), 0 0 0 4px var(--silk); z-index: 1; }
.track .pin.on { width: 6px; margin-left: -3px; }
.track .cur { position: absolute; top: 5px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--silk); z-index: 2; box-shadow: 0 0 0 2px var(--mask); }
.scale { position: relative; height: 22px; margin: 2px 0; }
.scale i { position: absolute; top: 0; font-style: normal; font-size: 11px; color: var(--silk-dim); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.scale i::before { content: ""; display: block; width: 1px; height: 5px; margin: 0 auto 2px; background: rgba(238, 242, 232, .35); }
.plot { position: absolute; left: 5.5em; right: 0; top: 0; bottom: 0; margin-left: 12px; pointer-events: none; }
.needle { position: absolute; top: 4px; bottom: 6px; width: 0; border-left: 2px solid var(--gold); transition: left .3s; }
.needle b { position: absolute; top: -20px; left: 0; transform: translateX(-50%); background: var(--gold); color: #241c05; font: 600 12px/16px var(--num); padding: 0 6px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }
@media (max-width: 760px) { .vaxis { margin: 0 18px; } .vrow { grid-template-columns: 4.2em 1fr; } .plot { left: 4.2em; } }

/* ---------- 表格 ---------- */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--accent-soft); font-weight: 600; }
tr.hl td:first-child { box-shadow: inset 4px 0 0 var(--vc, var(--accent)); padding-left: 10px; }
td.nw { white-space: nowrap; }
td.v::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--vc); margin-right: 8px; }
.empty { color: var(--muted); padding: 10px 0; }

/* ---------- 設定：左邊是段落名稱，右邊是控制項 ---------- */
#view-settings { gap: 0; }
#view-settings .grid2 { display: block; }
#view-settings .card { display: grid; grid-template-columns: 210px minmax(0, 1fr); column-gap: 32px; padding: 22px 0 24px; }
#view-settings .card > h3 { grid-column: 1; grid-row: 1 / span 12; align-self: start; margin: 0; }
#view-settings .card > :not(h3) { grid-column: 2; min-width: 0; }
@media (max-width: 760px) { #view-settings .card { display: block; } #view-settings .card > h3 { margin-bottom: 12px; } }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .modes { grid-template-columns: 1fr; } }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: 8px; padding: 11px 13px; cursor: pointer; }
.opt:hover { background: var(--soft); }
.opt:has(input:checked) { border-color: var(--on); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--on); }
.opt input { margin-top: 2px; }
.opt b { display: block; font-weight: 600; }
.opt span { display: block; color: var(--muted); font-size: 12px; }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 14px 20px; align-items: center; }
.fields > .lbl { color: var(--muted); }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; justify-self: start; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg label { position: relative; padding: 6px 15px; cursor: pointer; border-right: 1px solid var(--line-strong); }
.seg label:last-child { border-right: 0; }
.seg label:hover { background: var(--soft); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--mask); color: var(--silk); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: -2px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 12px; cursor: pointer; }
.chip:hover { background: var(--soft); }
.chip:has(input:checked) { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.chip input { display: none; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 3px 0; }
.check input { margin-top: 2px; }
.check b { font-weight: 600; }
.check span { display: block; color: var(--muted); font-size: 12px; }
.labgrp { margin: 20px 0 6px; font: 600 14px/1.4 var(--sans); color: var(--text); }
.labs { display: grid; }
.lab { padding: 11px 0; border-bottom: 1px solid var(--line); }
.lab:last-child { border-bottom: 0; }
.lab.off, .check.off { opacity: .5; }
.labhead { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.labhead input { margin-top: 2px; }
.labhead b { font-weight: 600; }
.labhead span:not(.tag):not(.labtags) { display: block; color: var(--muted); font-size: 12px; }
.labtags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.lab details { margin: 6px 0 0 44px; font-size: 12px; color: var(--muted); }
.lab summary { cursor: pointer; color: var(--accent); width: max-content; }
.lab ul { margin: 6px 0 2px; padding-left: 18px; }
.lab li { margin: 3px 0; }
.labin { margin: 8px 0 0 44px; }
.labin input[type=number] { width: 84px; }
@media (max-width: 640px) { .labhead { flex-wrap: wrap; } .labtags { margin-left: 44px; justify-content: flex-start; } .lab details, .labin { margin-left: 44px; } }
.actions { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 14px; box-shadow: 0 -8px 20px rgba(0, 0, 0, .14); margin-top: 12px; }
@media (max-width: 640px) { .fields { grid-template-columns: 1fr; gap: 4px 0; } .fields > .lbl { margin-top: 10px; } }

/* ---------- 記錄：時間軸 ---------- */
.logbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.filters button { border: 0; border-right: 1px solid var(--line-strong); background: transparent; padding: 5px 14px; cursor: pointer; }
.filters button:last-child { border-right: 0; }
.filters button:hover { background: var(--soft); }
.filters button[aria-pressed="true"] { background: var(--mask); color: var(--silk); font-weight: 600; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.ev { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 600; }
.ev::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); box-shadow: 0 0 0 3px var(--panel); position: relative; }
.ev.ok::before { background: var(--ok); }
.ev.warn::before { background: var(--warn); }
.ev.bad::before { background: var(--bad); }
.ev.acc::before { background: var(--accent); }
.logrow { display: grid; grid-template-columns: 84px 150px 1fr; gap: 4px 12px; padding: 9px 0;
  background: linear-gradient(var(--line-strong), var(--line-strong)) 100px 0 / 1px 100% no-repeat; }
.logrow.head { color: var(--muted); font-size: 12px; padding: 0 0 8px; background: none; }
.logrow .time { color: var(--muted); font-variant-numeric: tabular-nums; }
.logrow .detail { min-width: 0; overflow-wrap: anywhere; }
.logrow.bad .detail { color: var(--bad); }
@media (max-width: 640px) {
  .logrow { grid-template-columns: auto 1fr; background: none; border-bottom: 1px solid var(--line); }
  .logrow .detail { grid-column: 1 / -1; }
  .logrow.head { display: none; }
}
.pdos { display: flex; flex-wrap: wrap; gap: 4px; }
.pdo { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font-size: 12px; white-space: nowrap; background: var(--soft); font-variant-numeric: tabular-nums; }
.pdo i { font-style: normal; color: var(--muted); }
.simrow { display: grid; grid-template-columns: 28px 120px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.simrow:last-child { border-bottom: 0; }
.simrow select { width: 100%; }
.simrow input[type=number] { width: 76px; }
.simsub { font-weight: 600; margin: 14px 0 6px; }
@media (max-width: 640px) { .simrow { grid-template-columns: 24px 1fr auto; } .simrow .simf { grid-column: 1 / -1; order: 1; } }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.bat { height: 8px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; max-width: 220px; }
.bat > div { height: 100%; background: var(--ok); }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand">PPStoAVS</div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText"></span><span id="devInfo"></span></div>
    <span class="spacer"></span>
    <span id="msg"></span>
    <select id="lang" aria-label="Language"><option value="zh">繁體中文</option><option value="zhs">简体中文</option><option value="en">English</option></select>
    <button class="btn primary" id="btnConnect"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="status" data-i18n="tabStatus"></button>
    <button class="tab" role="tab" data-tab="settings" data-i18n="tabSettings"></button>
    <button class="tab" role="tab" data-tab="log" data-i18n="tabLog"></button>
    <button class="tab" role="tab" data-tab="sim" data-i18n="tabSim"></button>
  </nav>
</div>

<main>
  <!-- ===== 狀態 ===== -->
  <div class="view" id="view-status">
    <div class="notice" id="guide">
      <h3 data-i18n="guideTitle"></h3>
      <ol><li data-i18n="guide1"></li><li data-i18n="guide2"></li><li data-i18n="guide3"></li></ol>
    </div>
    <div class="board">
    <div class="flow">

    batDesign: u16(p, 10), batFull: u16(p, 12), bsdo: u32(p, 14), chgPdp: p[18], backPdp: p[19], sido: u32(p, 20), chgTemp: p[24],

/* ================= PDO 轉換模擬 ================= */
/* SIM-BEGIN：移植自韌體 bridge.c build_back_caps()，韌體修改轉換規則時必須同步 */
const P_FIX = 0, P_PPS = 12, P_EAVS = 13, P_SAVS = 14;
function pdoParse(v) {
  v >>>= 0;
  const hi = v >>> 28, t = (hi & 12) !== 12 ? hi & 12 : hi;

  else if (t === 8) { p.max = ((v >>> 20) & 0x3FF) * 50; p.min = ((v >>> 10) & 0x3FF) * 50; p.ma = (v & 0x3FF) * 10; }
  else if (t === P_PPS) { p.max = ((v >>> 17) & 0xFF) * 100; p.min = ((v >>> 8) & 0xFF) * 100; p.ma = (v & 0x7F) * 50; }
  else if (t === P_SAVS) { p.min = 9000; p.max = (v & 0x3FF) ? 20000 : 15000; p.ma = ((v >>> 10) & 0x3FF) * 10; p.ma20 = (v & 0x3FF) * 10; }
  else if (t === P_EAVS) { p.min = ((v >>> 8) & 0xFF) * 100; p.max = ((v >>> 17) & 0x1FF) * 100; p.pdp = v & 0xFF; p.ma = 5000; }
  return p;
}
const fixRaw = (mv, ma, fl = 0) => (fl | (Math.floor(mv / 50) << 10) | Math.floor(ma / 10)) >>> 0;
const ppsRaw = (lo, hi, ma) => ((0xC << 28) | (Math.floor(hi / 100) << 17) | (Math.floor(lo / 100) << 8) | Math.floor(ma / 50)) >>> 0;
const savsRaw = (ma15, ma20) => ((0xE << 28) | (Math.floor(ma15 / 10) << 10) | Math.floor(ma20 / 10)) >>> 0;
const eavsRaw = (lo, hi, pdp) => ((0xD << 28) | (Math.floor(hi / 100) << 17) | (Math.floor(lo / 100) << 8) | (pdp & 0xFF)) >>> 0;
/*
 * c：設定（readForm 格式）；raws：充電器 PDO；o.eprMode：前端處於 EPR 模式；o.rearAvsOk：設備已聲明支援 AVS（Lab 後端二次握手）
 * 返回 { pdos, src, held }：後端 PDO、各自對應的充電器位置（1 起）、AVS 是否因二次握手暫扣
 */
function simBuild(c, raws, o = {}) {
  const min = Math.min, MAXN = 7;
  const fc = raws.map(pdoParse), n = fc.length;
  const flags = c.flags ?? 0, flags2 = c.flags2 ?? 0;
  if (n === 0) { const ma = min(500, c.maxMa); return { pdos: [fixRaw(5000, ma)], src: [1], held: false }; }
  const hidden = (mv) => (mv === 9000 && c.hide & 1) || (mv === 12000 && c.hide & 2) || (mv === 15000 && c.hide & 4) || (mv === 20000 && c.hide & 8);
  const findMv = (list, mv) => list.findIndex((e) => e.mv === mv);
  const insertSorted = (list, e) => {
    if (list.length >= MAXN || findMv(list, e.mv) >= 0) return;
    let i = list.length; while (i > 0 && list[i - 1].mv > e.mv) i--;
    list.splice(i, 0, e);
  };
  const avsTier = (mv) => (mv >= 20000 && c.maxMv >= 20000 ? 2 : mv >= 15000 ? 1 : 0);
  const nativeAvs = () => fc.findIndex((p) => p.type === P_SAVS && p.ma > 0);
  const ppsCovering = (mv) => { let b = -1; fc.forEach((p, i) => { if (p.type === P_PPS && p.min <= mv && p.max >= mv && (b < 0 || p.ma > fc[b].ma)) b = i; }); return b; };
  const E = (type, fe, pos, lo, mv, ma, ma20 = 0) => ({ type, fe, pos, lo, mv, ma, ma20 });
  const wantAvs = c.mode === 0 || c.mode === 2, wantPps = c.mode === 1 || c.mode === 2;
  let held = false;

  /* 1. 充電器 Fixed */
  let fixed = [];
  fc.forEach((p, i) => { if (p.type === P_FIX && p.raw !== 0 && p.max <= c.maxMv && !hidden(p.max)) insertSorted(fixed, E(P_FIX, P_FIX, i + 1, p.max, p.max, min(p.ma, c.maxMa))); });
  /* 1b. Lab 強制 PPS */
  const force = !!(flags2 & 4);
  if (force) fixed.forEach((f) => { const k = ppsCovering(f.mv); if (k >= 0) { f.fe = P_PPS; f.pos = k + 1; f.ma = min(fc[k].ma, c.maxMa); } });

  /* 2. AVS */
  let avs = null;
  const f15 = findMv(fixed, 15000);
  if (wantAvs && f15 >= 0) {
    let ppsTier = 0, ppsI = 0;
    fc.forEach((p, i) => {
      if (p.type !== P_PPS || p.min > 9000) return;
      const tr = avsTier(p.max);
      if (tr > ppsTier || (tr === ppsTier && tr > 0 && p.ma > fc[ppsI].ma)) { ppsTier = tr; ppsI = i; }
    });
    const nat = nativeAvs(), natTier = nat >= 0 ? avsTier(fc[nat].max) : 0;
    let epr = -1;
    if (flags & 64 && o.eprMode) epr = fc.findIndex((p) => p.type === P_EAVS && p.min <= 15000 && p.max >= 20000 && p.pdp > 0);
    const f9 = findMv(fixed, 9000);

    if (epr >= 0 && c.maxMv >= 20000 && findMv(fixed, 20000) >= 0) {

    } else if (natTier > 0 && (force ? natTier > ppsTier : natTier >= ppsTier)) {

    } else if (ppsTier > 0) {

    }
    if (src) {
      const f20 = findMv(fixed, 20000);
      const avsMax = avsTier(src.max) === 2 && f20 >= 0 ? 20000 : 15000;
      const fromEpr = src.type === P_EAVS, drop20 = avsMax < 20000 && f20 >= 0 ? 1 : 0;
      if (fixed.length - drop20 < MAXN && flags & 8 && !o.rearAvsOk) held = true;
      else if (fixed.length - drop20 < MAXN) {
        if (drop20) fixed.splice(f20, 1);
        const ma15 = min(fixed[f15].ma, s15);
        let ma20 = 0;
        if (fromEpr) ma20 = min(s20, c.maxMa);
        else {
          fixed[f15].ma = ma15;

        }
        avs = E(P_SAVS, src.type, srcPos, 9000, avsMax, ma15, ma20);
      }
    }
  }

  /* 3. PPS 透傳（二次握手第一階段用 PPS 代替 AVS） */
  let pps = [];
  if (wantPps || held) {
    fc.forEach((p, i) => {
      if (p.type !== P_PPS || p.min >= c.maxMv) return;
      const e = E(P_PPS, P_PPS, i + 1, p.min, min(p.max, c.maxMv), min(p.ma, c.maxMa));
      const k = findMv(pps, e.mv);
      if (k < 0) insertSorted(pps, e);
      else if (e.ma > pps[k].ma || (e.ma === pps[k].ma && e.lo < pps[k].lo)) pps[k] = e;
    });
    const nat = nativeAvs();
    if (flags & 16 && nat >= 0 && fc[nat].max > 9000) {
      const a = fc[nat], mv = min(a.max, c.maxMv);
      const ma = mv > 15000 && a.ma20 ? min(a.ma, a.ma20) : a.ma;
      insertSorted(pps, E(P_PPS, P_SAVS, nat + 1, 5000, mv, min(ma, c.maxMa)));
    }
  }
  /* 3b. Lab 自訂 PPS */
  let custom = null;
  if (flags2 & 8 && c.ppsLo != null) {
    const lo = c.ppsLo * 100, hi = min(c.ppsHi * 100, c.maxMv);
    let best = -1;
    if (lo < hi) fc.forEach((p, i) => { if (p.type === P_PPS && p.min <= lo && p.max >= hi && (best < 0 || p.ma > fc[best].ma)) best = i; });
    let srcMa = best >= 0 ? fc[best].ma : 0;
    if (best < 0 && lo >= 9000 && lo < hi) {
      const a = nativeAvs();
      if (a >= 0 && fc[a].max >= hi) { best = a; srcMa = hi > 15000 && fc[a].ma20 ? min(fc[a].ma, fc[a].ma20) : fc[a].ma; }
    }
    if (best >= 0 && srcMa > 0) {
      custom = E(P_PPS, fc[best].type, best + 1, lo, hi, min(srcMa, c.ppsMa50 * 50, c.maxMa));
      const k = findMv(pps, hi); if (k >= 0) pps.splice(k, 1);
    }
  }
  const room = MAXN - fixed.length - (avs ? 1 : 0) - (custom ? 1 : 0);
  if (pps.length > room) pps = pps.slice(pps.length - room);
  if (custom) insertSorted(pps, custom);

  /* 4. 轉換 Fixed：12V 轉換或自訂 Fixed */
  let convMv = 0, convMa = c.maxMa;
  if (flags & 1 && !hidden(12000)) convMv = 12000;

  if (convMv && convMv <= c.maxMv && findMv(fixed, convMv) < 0 && fixed.length + (avs ? 1 : 0) + pps.length < MAXN) {
    let best = ppsCovering(convMv), srcMa = best >= 0 ? fc[best].ma : 0;

  /* 5. 輸出 */

  fixed.forEach((f, k) => all.push([fixRaw(f.mv, f.ma, k === 0 ? unc : 0), f.pos]));
  if (avs) all.push([savsRaw(avs.ma, avs.ma20), avs.pos]);
  pps.forEach((p) => all.push([ppsRaw(p.lo, p.mv, p.ma), p.pos]));
  const out = all.slice(0, MAXN);
  return { pdos: out.map((x) => x[0]), src: out.map((x) => x[1]), held };
}
/* SIM-END */

/* ================= settings ================= */
/* hasComp：20 字節格式（韌體 v0.6.0 / 協議 v5 起）才有補償欄位 */

async function loadSessions() {

  sel.innerHTML = ids.map((id) => {

    return `<option value="${id}">${t("sessionN")(id)}${id === state.current ? ` (${t("currentS")})` : ""} · ${s ? s.pages : 0} ${t("pages")}</option>`;

    return { t: r.t, type: r.type, name: t("ev")[r.type] ?? "type " + r.type, text, html: html ?? esc(text), cls, cat };
  });
}
function renderLog() {
  const L = state.log;
  document.querySelectorAll("#filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === state.filter)));
  if (!L || !dev) { $("logTable").innerHTML = ""; $("logNote").textContent = ""; $("logStats").innerHTML = ""; return; }
  const rows = decodeRecords(L.records);
  const count = (f) => rows.filter(f).length;
  const nReq = count((r) => r.type === 8), nFail = count((r) => r.type === 8 && r.cls === "bad");
  const nProt = count((r) => r.type === 9), nRst = count((r) => r.type === 10);
  $("logStats").innerHTML = [
    `<span class="tag">${nReq} ${t("stReq")}</span>`,
    `<span class="tag ${nFail ? "bad" : ""}">${nFail} ${t("stFail")}</span>`,
    `<span class="tag ${nProt ? "bad" : ""}">${nProt} ${t("stProt")}</span>`,
    `<span class="tag ${nRst ? "warn" : ""}">${nRst} ${t("stRst")}</span>`,
  ].join("");
  const shown = rows.filter((r) => state.filter === "all" || r.cat === state.filter);
  $("logTable").innerHTML = shown.length
    ? `<div class="logrow head"><div>${t("colTime")}</div><div>${t("colEvent")}</div><div>${t("colDetail")}</div></div>` +
      shown.map((r) => `<div class="logrow ${r.cls}"><div class="time mono">${(r.t / 1000).toFixed(3)} s</div>` +
        `<div><span class="ev ${r.cls}">${esc(r.name)}</span></div><div class="detail">${r.html}</div></div>`).join("")
    : `<div class="empty">${t("noRecords")}</div>`;
  const notes = [];
  if (L.crcErrors) notes.push(`${L.crcErrors} ${t("crcBad")}`);
  if (L.session === state.current && state.info && state.info.dropped) notes.push(`${state.info.dropped} ${t("dropped")}`);
  $("logNote").textContent = notes.join(" · ");
}
function exportLog() {
  if (!state.log) return;
  const out = { session: state.log.session, exported: new Date().toISOString(),
    records: decodeRecords(state.log.records).map((r, i) => ({ t_ms: r.t, event: r.name, detail: r.text,
      raw: Array.from(state.log.records[i].data, (x) => x.toString(16).padStart(2, "0")).join("") })) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = `ppstoavs-session-${state.log.session}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= render all / i18n ================= */
function applyI18n() {
  document.documentElement.lang = { zh: "zh-Hant", zhs: "zh-Hans" }[lang] || "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-list]").forEach((el) => {
    el.replaceChildren(...(t(el.dataset.i18nList) || []).map((x) => Object.assign(document.createElement("li"), { textContent: x })));
  });
  $("lang").value = lang;
  renderAll();
}
function renderAll() { renderConn(); renderStatus(); renderCfgState(); updateDirty(); if (state.log) loadSessionsLabelsOnly(); renderLog(); simRowsHtml(); renderSim(); }
function loadSessionsLabelsOnly() {
  const sel = $("sessionSel");
  Array.from(sel.options).forEach((o) => {
    const id = Number(o.value), s = state.sessions.find((x) => x.session === id);
    o.textContent = `${t("sessionN")(id)}${id === state.current ? ` (${t("currentS")})` : ""} · ${s ? s.pages : 0} ${t("pages")}`;
  });
}

/* ================= wiring ================= */
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
$("btnConnect").onclick = connect;
$("view-settings").addEventListener("input", updateDirty);
$("view-settings").addEventListener("change", updateDirty);
$("logPps").addEventListener("change", (e) => { if (e.target.checked && !confirm(t("logPpsWarn"))) { e.target.checked = false; updateDirty(); } });
/* 5A E-Marker：電流上限 5A、OCP 5.5A；關閉時收回到 3A / 5A */
function applyCurLimits() {
  const a5 = $("emarker").checked, mi = $("maxMa"), oi = $("ocpMa");
  mi.max = a5 ? 5000 : 3000; oi.max = a5 ? 5500 : 5000;
  if (Number(mi.value) > Number(mi.max)) mi.value = mi.max;
  if (Number(oi.value) > Number(oi.max)) oi.value = oi.max;
  $("maxIdTxt").dataset.i18n = a5 ? "maxId5" : "maxId"; $("maxIdTxt").textContent = t($("maxIdTxt").dataset.i18n);
  applyLabDeps();
}
/* Lab 相依：EPR AVS 需要 E-Marker；自訂 Fixed 才顯示輸入框 */
function applyLabDeps() {
  const a5 = $("emarker").checked;
  $("eprAvs").disabled = !a5; if (!a5) $("eprAvs").checked = false;
  $("lab-eprAvs").classList.toggle("off", !a5);
  $("fixcIn").hidden = !$("fixc").checked;
  $("ppscIn").hidden = !$("ppsc").checked;
}
/* 資訊透傳：身份透傳依附於資訊透傳；舊韌體沒有這個功能 */
function applyInfo() {
  const old = !!state.cfg && state.cfg.flags2 == null;
  $("infoPt").disabled = old;
  const on = $("infoPt").checked && !old;
  $("idPt").disabled = !on; if (!on) $("idPt").checked = false;
  $("idPtRow").classList.toggle("off", !on);
  $("forcePps").disabled = old; $("lab-forcePps").classList.toggle("off", old);
  const oldUfcs = !!state.info && state.info.proto < 7;
  $("ufcs").disabled = oldUfcs; $("lab-ufcs").classList.toggle("off", oldUfcs);
  const oldPps = !!state.cfg && state.cfg.ppsLo == null;
  ["ppsc", "ppscLo", "ppscHi", "ppscA"].forEach((id) => ($(id).disabled = oldPps)); $("lab-ppsc").classList.toggle("off", oldPps);
}
$("infoPt").addEventListener("change", applyInfo);
/* 電壓補償：單位、範圍隨方式變化；舊韌體沒有這個功能 */
function applyComp() {
  const old = !!state.cfg && state.cfg.compMode == null;
  const m = old ? 0 : Number((document.querySelector("input[name=compMode]:checked") || { value: 0 }).value);
  document.querySelectorAll("input[name=compMode]").forEach((r) => (r.disabled = old));
  const vi = $("compVal");
  vi.disabled = old || m === 0; vi.max = m === 1 ? 1000 : 500;
  if (Number(vi.value) > Number(vi.max)) vi.value = vi.max;
  $("compUnit").textContent = m === 1 ? "mV" : "mΩ";
  $("compHint").textContent = m === 1 ? t("compHintV") : t("compHintR");
}
document.querySelectorAll("input[name=compMode]").forEach((r) => r.addEventListener("change", () => {
  if (Number(r.value) === 2 && !Number($("compVal").value)) $("compVal").value = 15;
  applyComp(); updateDirty();
}));
/* 自訂 Fixed 與 12V 轉換互斥 */
$("ppsc").addEventListener("change", () => { applyLabDeps(); updateDirty(); });
$("fixc").addEventListener("change", (e) => { if (e.target.checked && $("fix12").checked) { $("fix12").checked = false; msg(t("fixcOff12")); } applyLabDeps(); updateDirty(); });
$("fix12").addEventListener("change", (e) => { if (e.target.checked && $("fixc").checked) { $("fixc").checked = false; msg(t("fix12OffC")); } applyLabDeps(); updateDirty(); });
$("emarker").addEventListener("change", (e) => { if (e.target.checked && !confirm(t("emarkerWarn"))) e.target.checked = false; applyCurLimits(); updateDirty(); });
$("btnApply").onclick = () => applyCfg(false);
$("btnRevert").onclick = () => state.cfg && writeForm(state.cfg);
$("btnDefaults").onclick = () => { if (confirm(t("defaultsConfirm"))) applyCfg(true); };
$("btnLogRefresh").onclick = () => loadSessions().catch((e) => msg(e.message));
$("sessionSel").onchange = (e) => loadLog(Number(e.target.value)).catch((err) => msg(err.message));
document.querySelectorAll("#filters button").forEach((b) => (b.onclick = () => { state.filter = b.dataset.f; renderLog(); }));
$("btnExport").onclick = exportLog;
$("btnClear").onclick = async () => {
  if (!confirm(t("clearConfirm"))) return;
  try { await request(0x22); setTimeout(() => loadSessions().catch(() => {}), 1500); } catch (e) { msg(e.message); }
};
$("lang").onchange = (e) => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (err) {} applyI18n(); };

let tick = 0;
setInterval(async () => {
  if (!dev) return;
  try {
    await refreshStatus();
    if (++tick % 3 === 0) { await refreshInfo(); if (state.cfgSaving || $("cfgState").textContent === t("saving")) await loadCfg(false); }
  } catch (e) { msg(e.message); }
}, 1000);

let startTab = "status";
try { startTab = localStorage.getItem("tab") || startTab; } catch (e) {}
setTab(["status", "settings", "log", "sim"].includes(startTab) ? startTab : "status");
/* 未連線時表單填入韌體預設值（供轉換模擬）；連線後載入裝置設定 */
const CFG_DEFAULT = { mode: 0, hide: 0, maxMv: 20000, maxMa: 3000, ovp: 5, uvp: 5, ocpMa: 3500, ocpMs: 50, flags: 0, fixDv: 0, fixMa50: 0,
  compMode: 2, compVal: 15, flags2: 0, ppsLo: 33, ppsHi: 160, ppsMa50: 60 };
writeForm(CFG_DEFAULT);
applyI18n();

if (!("hid" in navigator)) {
  const g = $("guide"); g.className = "notice bad"; g.innerHTML = `<h3>${esc(t("noHid"))}</h3>`;
  $("btnConnect").disabled = true;
} else {
  navigator.hid.addEventListener("disconnect", (e) => { if (e.device === dev) { dev = null; resetState(); renderAll(); } });
  navigator.hid.getDevices().then((list) => {
    const d = list.find((x) => x.vendorId === FILTER.vendorId && x.productId === FILTER.productId);
    if (d) openDevice(d).catch((e) => msg(e.message));
  });
}
</script>
</body>
</html>
